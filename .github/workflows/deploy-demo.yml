name: Deploy demo

on:
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy demo to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # secrets can't be read in a job-level `if`, so the no-op check lives
      # here instead — skips cleanly until CLOUDFLARE_API_TOKEN is configured.
      - name: Build for Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm build:cloudflare
        env:
          STORAGE_DRIVER: r2
          R2_BUCKET_BINDING: BOOKHOARD_BUCKET

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy
